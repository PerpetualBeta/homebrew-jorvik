name: Refresh casks

# Follow the Jorvik releases without anyone having to remember to.
# A no-op run costs 24 authenticated API calls and writes nothing.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-casks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate casks from the current releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/generate-casks.py

      - name: Commit any change
        run: |
          if git diff --quiet -- Casks; then
            echo "No cask changed."
            exit 0
          fi
          git config user.name  "jorvik-bot"
          git config user.email "noreply@jorviksoftware.cc"
          echo "Updated:"
          git diff --name-only -- Casks
          git add Casks
          git commit -m "Casks: follow the latest releases

          Generated by tools/generate-casks.py on its daily run."
          git push
