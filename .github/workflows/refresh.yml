name: Refresh casks

# Follow the Jorvik releases without anyone having to remember to.
# A no-op run costs 24 authenticated API calls and writes nothing.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-casks
  cancel-in-progress: false

jobs:
  refresh:
    # Linux on purpose: the generator only needs gh, python3 and git, and the
    # hosted macOS arm64 pool can run dry. On 2026-11-03 a run sat queued for
    # 15 minutes and was cancelled without a runner. CI stays on macOS because
    # brew audit needs it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Regenerate casks from the current releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/generate-casks.py

      - name: Commit any change
        run: |
          # Stage first: a first release writes a new, untracked cask, and
          # `git diff` without --cached never sees untracked files.
          git add Casks
          if git diff --cached --quiet -- Casks; then
            echo "No cask changed."
            exit 0
          fi
          git config user.name  "jorvik-bot"
          git config user.email "noreply@jorviksoftware.cc"
          echo "Updated:"
          git diff --cached --name-status -- Casks
          git commit -m "Casks: follow the latest releases

          Generated by tools/generate-casks.py on its daily run."
          git push
