name: CI

on:
  push:
    branches: [main]
  pull_request:

# Casks are macOS-only, so there is no Linux leg here on purpose:
# `brew audit --tap=` eagerly loads casks before its own OS filter and
# trips over them on a Linux runner.
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: homebrew-jorvik

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      # setup-homebrew has already tapped this repository from GitHub, so the
      # tap directory exists before we get here — which silently turned an
      # earlier `ln -s` into a link *inside* it pointing back at the workspace,
      # and a loop. Replace it outright so what gets audited is the checkout in
      # hand, not the pushed default branch (which is not the same thing on a
      # pull request).
      - name: Put the checkout in place as the tap
        id: tap
        run: |
          TAPS="$(brew --repository)/Library/Taps/perpetualbeta"
          mkdir -p "$TAPS"
          rm -rf "$TAPS/homebrew-jorvik"
          mv "$GITHUB_WORKSPACE/homebrew-jorvik" "$TAPS/homebrew-jorvik"
          echo "path=$TAPS/homebrew-jorvik" >> "$GITHUB_OUTPUT"
          brew tap

      - name: brew style
        run: brew style perpetualbeta/jorvik

      # --online fetches and checksums every release, and catches the
      # cask-versus-core-formula token collisions that the cask API alone
      # will not show you.
      - name: brew audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew audit --cask --online --strict --tap=perpetualbeta/jorvik

      - name: Casks are in step with the releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ steps.tap.outputs.path }}
        run: ./tools/generate-casks.py --check
