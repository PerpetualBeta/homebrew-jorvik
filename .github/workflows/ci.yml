name: CI

on:
  push:
    branches: [main]
  pull_request:

# Casks are macOS-only, so there is no Linux leg here on purpose:
# `brew audit --tap=` eagerly loads casks before its own OS filter and
# trips over them on a Linux runner.
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: homebrew-jorvik

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      # setup-homebrew relocates a tap checkout into the Taps directory itself,
      # so by this point $GITHUB_WORKSPACE/homebrew-jorvik is gone and the tap
      # is already in place. Earlier revisions of this workflow tried to
      # symlink and then to mv the checkout across, and both fought it: the
      # link landed *inside* the existing tap and looped, and the mv had no
      # source left to move. Locate it and move on.
      - name: Locate the tap
        id: tap
        run: |
          TAP="$(brew --repository)/Library/Taps/perpetualbeta/homebrew-jorvik"
          if [ ! -d "$TAP" ]; then
            echo "::error::expected the tap at $TAP; setup-homebrew did not place it"
            exit 1
          fi
          echo "path=$TAP" >> "$GITHUB_OUTPUT"
          brew tap

      - name: brew style
        run: brew style perpetualbeta/jorvik

      # --online fetches and checksums every release, and catches the
      # cask-versus-core-formula token collisions that the cask API alone
      # will not show you.
      - name: brew audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew audit --cask --online --strict --tap=perpetualbeta/jorvik

      - name: Casks are in step with the releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ steps.tap.outputs.path }}
        run: ./tools/generate-casks.py --check
